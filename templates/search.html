<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZoomAuto</title>

    <link rel="icon" href="../static/images/logo's/main_logo.png" type="image/png">
    <link rel="stylesheet" href="../static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Science+Gothic:wght@700&display=swap" rel="stylesheet">
</head>
<body>

<div class="navigation">
        <a href="/" class="logo-link">
            <img src="../static/images/logo's/main_logo.png" alt="main_logo" class="logo">
        </a>
        <nav class="nav-center">
            <a href="/" title="Home Page"><b>Home</b></a>
            <a href="/contact"><b>Contact</b></a>
        </nav>


        <div class="account-block">
            <a href="/account" class="account-link">
                <img src="../static/images/icons/account_icon.png" alt="account_logo" class="account-logo">
            </a>
            <a href="/login" class="account-button">Login</a>
            <a href="/register" class="account-button">Register</a>
        </div>
</div>

<div class="search_h2">
    <h2>Results of the search</h2>
</div>

{% if cars %}
    {% for car in cars %}
<div class="car-recommendation-container">
    <div class="car-recommendation">
        <div class="car-offers">
            {% for car in cars %}
            <div class="car-card">

                <img src="{{ url_for('static', filename=car.image) }}"
                     alt="car.name">

                <div class="car-info">
                    <h3>{{ car.name }}</h3>
                    <p>
                        {{ car.year }} • {{ car.brand|title }} •
                        {{ "{:,}".format(car.price).replace(",", " ") }} €
                    </p>
                </div>
                <button>View offer</button>
            </div>
            {% endfor %}
        </div>

    </div>
</div>

        <hr>
    {% endfor %}
{% else %}
    <p>Нічого не знайдено 😕</p>
{% endif %}
</body>
</html>
