<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../static/images/main_logo.png" type="image/png">
    <link rel="stylesheet" href="../static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Science+Gothic:wght@700&display=swap" rel="stylesheet">
    <title>Home</title>
</head>

<body>
    <div class="navigation">
        <a href="/" class="logo-link">
            <img src="../static/images/main_logo.png" alt="main_logo" class="logo">
        </a>
        <nav class="nav-center">
            <a href="/" title="Home Page"><b>Home</b></a>
            <a href="/contact" title="Contact me"><b>Contact</b></a>
        </nav>

        <div class="account-block">
            <a href="/account" class="account-link">
                <img src="../static/images/account_icon.png" alt="account_logo" class="account-logo">
            </a>
            <a href="/login" class="account-button">Login</a>
            <a href="/register" class="account-button">Register</a>
        </div>
    </div>

    <header class="h1_home">
        <h1>Find your ideal car at ZoomAuto</h1>
    </header>
    <div class="car-search-container">
        <form method="get" action="{{ url_for('search') }}" class="car-search">

            <select name="brand" required>
                <option value="">Mark</option>
                <option value="bmw">BMW</option>
                <option value="audi">Audi</option>
                <option value="mercedes">Mercedes</option>
            </select>

            <select name="year" required>
                <option value="">Year</option>
                <option value="2024">2024</option>
                <option value="2023">2023</option>
                <option value="2022">2022</option>
            </select>

            <select name="price" required>
                <option value="">Price</option>
                <option value="0-10000">до 10 000 €</option>
                <option value="10000-20000">10 000 – 20 000 €</option>
                <option value="20000-40000">20 000 – 40 000 €</option>
            </select>

            <button type="submit">🔍 Find</button>
        </form>
    </div>


    <div class="car-recommendation-container">
        <div class="car-recommendation">
            <h2>ZoomAuto Car Recommendation</h2>
        </div>

        <div class="cars-container">
            <img src="" alt="ddd">
        </div>
    </div>

    <div>
        <h2>About me</h2>
        <p>SDadsopdaksdkaspadsoaosdppkoas</p>
    </div>
</body>
</html>
