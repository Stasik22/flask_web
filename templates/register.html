<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZoomAuto</title>
    <link rel="icon" href="../static/images/logo's/main_logo.png" type="image/icon type">
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>

<div class="navigation">
    <a href="/" class="logo-link">
        <img src="../static/images/logo's/main_logo.png" class="logo" alt="logo">
    </a>
</div>

<div class="registration_container">
    <div class="container_photo">
            <div class="auth-wrapper">
                <input type="radio" name="auth" id="login" checked hidden>
                <input type="radio" name="auth" id="register" hidden>

                <div class="auth-toggle">
                    <div class="toggle-bg"></div>
                    <label for="login">Login</label>
                    <label for="register">Register</label>
                </div>

                <div class="auth-forms">
                    <form method="POST" action="/register" class="auth-form registration_form">
                        {{ register_form.hidden_tag() }}
                        {{ register_form.username }}
                        {{ register_form.email }}
                        {{ register_form.password }}
                        {{ register_form.submit }}
                    </form>

                    <form method="POST" action="/login" class="auth-form login_form">
                        {{ login_form.hidden_tag() }}
                        {{ login_form.username }}
                        {{ login_form.password }}
                        {{ login_form.submit }}
                    </form>
                </div>
            </div>
        <div class="background_container">
        </div>
    </div>
</div>

</body>
</html>
